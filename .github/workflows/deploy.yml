name: Deploy Produccion

# Se ejecuta en el runner self-hosted instalado en el servidor de produccion
# (server-das, label `produccion`). Al vivir en el mismo host, se conecta a MySQL
# por localhost (el usuario `inventario` es solo-localhost).
#
# Por ahora solo se lanza manualmente (Actions > Deploy Produccion > Run workflow).
# Tras la salida a produccion se agregara el disparador `push` a main.

on:
    workflow_dispatch:

# Un deploy a la vez; no cancelar uno en curso (evita dejar la BD a medio migrar).
concurrency:
    group: deploy-produccion
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: [self-hosted, produccion]
        environment: produccion
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Generar .env desde secret
              env:
                  ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
              run: printf '%s\n' "$ENV_PRODUCTION" > .env

            - name: Instalar dependencias
              run: npm ci

            - name: Generar Prisma Client
              run: npm run db:generate

            - name: Verificar tipos y tests
              run: |
                  npx tsc --noEmit
                  npm test

            - name: Aplicar migraciones
              run: npm run db:migrate:deploy

            - name: Seed estructural (roles y administradores)
              env:
                  SEED_DEMO: "false"
              run: npm run db:seed

            - name: Build
              run: npm run build

            - name: Publicar con pm2
              run: |
                  pm2 startOrReload ecosystem.config.js --update-env
                  pm2 save
